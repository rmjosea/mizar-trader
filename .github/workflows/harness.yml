name: harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate harness and documentation
        run: python3 scripts/check_harness.py
      - name: Test harness validator
        run: python3 -m unittest discover -s tests/harness -v
