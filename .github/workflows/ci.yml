name: ci

# Pull requests are opened only on request, so every pushed branch is
# checked too, not only main.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
      # uv installs the interpreter named in .python-version.
      - name: Run make check
        run: make check

  stack:
    runs-on: ubuntu-latest
    env:
      STACK_CHECK_SENTINEL: ci-sentinel-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No repository secrets: the password is a throwaway sentinel value.
      - name: Create .env from .env.example
        run: sed "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$STACK_CHECK_SENTINEL/" .env.example > .env
      - name: Run stack check on amd64
        run: make stack-check
      - name: Stop stack
        if: always()
        run: docker compose down -v
